<!doctype html><html><head><title>Student | Smart Campus Guardian</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>🛡 SMART CAMPUS GUARDIAN</b><span>Student Portal</span><form action="/logout" method="post"><button>Logout</button></form></header><main class="grid"><section class="hero"><h1>Need immediate help?</h1><button class="danger" onclick="document.querySelector('#sos').showModal()">ACTIVATE SOS</button><button onclick="document.querySelector('#sos').showModal()">Silent SOS / Report incident</button></section><section><h2>My safety status</h2><div id="stats"></div></section><section class="wide"><h2>My incidents</h2><div id="incidents"></div></section><section class="wide"><h2>Campus alerts</h2><div id="alerts"></div></section></main><dialog id="sos"><form id="incident"><h2>What is happening?</h2><select name="incidentType"><option>PERSONAL_DANGER</option><option>MEDICAL_EMERGENCY</option><option>FIRE</option><option>ACCIDENT</option><option>SUSPICIOUS_ACTIVITY</option><option>SECURITY_ISSUE</option><option>THEFT</option><option>INFRASTRUCTURE_HAZARD</option><option>OTHER</option></select><select name="zoneId" id="zones"></select><textarea name="description" required placeholder="Describe the emergency"></textarea><label><input type="checkbox" name="silent"> Silent SOS</label><label><input type="checkbox" name="anonymousReport"> Submit anonymously</label><button class="danger">Confirm emergency</button><button type="button" onclick="sos.close()">Cancel</button></form></dialog><script src="/js/student.js"></script></body></html>
