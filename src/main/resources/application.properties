spring.application.name=smart-campus-guardian
server.port=${SCG_SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${SCG_DB_HOST:localhost}:${SCG_DB_PORT:3306}/${SCG_DB_NAME:student_safety}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SCG_DB_USERNAME:root}
spring.datasource.password=${SCG_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.thymeleaf.cache=false
server.error.include-message=never
